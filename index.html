<style>
  :root {
    --navy: #1F3B5C;
    --navy-dark: #16293F;
    --gold: #FFD966;
    --gold-dark: #C9A400;
    --bg: #F2F4F7;
    --text: #1A1A1A;
    --muted: #6B7280;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--navy);
    color: white;
    padding: 14px 16px 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }
  header h1 {
    margin: 0; font-size: 17px; font-weight: 700; letter-spacing: 0.2px;
  }
  header .sub {
    margin: 2px 0 10px; font-size: 12px; opacity: 0.85;
  }
  #todayCard {
    background: var(--navy-dark);
    border-radius: 10px;
    padding: 10px 12px;
    margin-top: 4px;
  }
  #todayCard .label {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.6px;
    color: var(--gold);
    font-weight: 700;
    margin-bottom: 2px;
  }
  #todayCard .date {
    font-size: 15px; font-weight: 700; margin-bottom: 4px;
  }
  #todayCard .event {
    font-size: 13px; opacity: 0.92; line-height: 1.35;
  }
  #jumpBtn {
    display: block;
    width: 100%;
    margin-top: 10px;
    background: var(--gold);
    color: var(--navy-dark);
    border: none;
    border-radius: 8px;
    padding: 10px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.3px;
    cursor: pointer;
  }
  #jumpBtn:active { transform: scale(0.98); }

  #searchWrap {
    padding: 10px 16px;
    background: var(--bg);
    position: sticky;
    top: 128px;
    z-index: 9;
  }
  #searchWrap.tall { top: 150px; }
  #searchBox {
    width: 100%;
    padding: 9px 12px;
    border-radius: 8px;
    border: 1px solid #D1D5DB;
    font-size: 13px;
    background: white;
  }

  main { padding: 4px 12px 40px; }

  .row {
    display: flex;
    gap: 10px;
    padding: 10px 10px;
    margin-bottom: 6px;
    border-radius: 8px;
    background: white;
    border: 1px solid #E5E7EB;
    align-items: flex-start;
  }
  .row .datecol {
    min-width: 62px;
    text-align: center;
    flex-shrink: 0;
  }
  .row .datecol .d { font-size: 15px; font-weight: 700; line-height: 1.1; }
  .row .datecol .m { font-size: 10px; text-transform: uppercase; color: var(--muted); }
  .row .datecol .day { font-size: 10.5px; color: var(--muted); margin-top: 2px; }
  .row .particulars {
    font-size: 13px; line-height: 1.4; padding-top: 1px;
    white-space: pre-line;
  }
  .row.empty .particulars { color: #B0B4BA; font-style: italic; }

  .row.today {
    border: 2px solid var(--gold-dark);
    box-shadow: 0 0 0 3px rgba(255,217,102,0.35);
    font-weight: 700;
  }
  .row.today .datecol .d { color: var(--navy); }

  .month-divider {
    font-size: 11px;
    font-weight: 700;
    color: var(--navy);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 14px 4px 6px;
    opacity: 0.75;
  }

  footer {
    text-align: center;
    font-size: 10.5px;
    color: var(--muted);
    padding: 10px 20px 30px;
  }
</style>
</head>

const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const DAYNAMES = {Mon:"Monday",Tue:"Tuesday",Wed:"Wednesday",Thu:"Thursday",Fri:"Friday",Sat:"Saturday",Sun:"Sunday"};

function todayISO() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return y+"-"+m+"-"+day;
}

function fmtDate(iso) {
  const [y,m,d] = iso.split('-').map(Number);
  return {day: d, month: MONTHS[m-1].slice(0,3), monthFull: MONTHS[m-1], year: y};
}

const container = document.getElementById('listContainer');
const todayStr = todayISO();
let lastMonth = null;
let todayRowEl = null;

DATA.forEach(item => {
  const {day, month} = fmtDate(item.date);
  const monthKey = item.date.slice(0,7);
  if (monthKey !== lastMonth) {
    const divider = document.createElement('div');
    divider.className = 'month-divider';
    const f = fmtDate(item.date);
    divider.textContent = f.monthFull + " " + f.year;
    container.appendChild(divider);
    lastMonth = monthKey;
  }

  const row = document.createElement('div');
  row.className = 'row' + (item.particulars ? '' : ' empty');
  row.dataset.search = (item.particulars || '').toLowerCase();
  row.dataset.date = item.date;

  if (item.date === todayStr) {
    row.classList.add('today');
    row.style.background = item.color || '#FFFFFF';
    todayRowEl = row;
  } else {
    row.style.background = item.color || '#FFFFFF';
  }

  row.innerHTML = `
    <div class="datecol">
      <div class="d">${day}</div>
      <div class="m">${month}</div>
      <div class="day">${item.day}</div>
    </div>
    <div class="particulars">${item.particulars ? item.particulars.replace(/\n/g,'<br>') : 'No events listed'}</div>
  `;
  container.appendChild(row);
});

// Populate today card
const todayData = DATA.find(d => d.date === todayStr);
const now = new Date();
const dayName = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][now.getDay()];
document.getElementById('todayDate').textContent = dayName + ", " + now.getDate() + " " + MONTHS[now.getMonth()] + " " + now.getFullYear();
document.getElementById('todayEvent').textContent = todayData
  ? (todayData.particulars || "No events listed for today.")
  : "Today falls outside the calendar range.";

function jumpToToday() {
  if (todayRowEl) {
    todayRowEl.scrollIntoView({behavior: 'smooth', block: 'center'});
  }
}

function filterRows() {
  const q = document.getElementById('searchBox').value.toLowerCase();
  const rows = document.querySelectorAll('.row');
  rows.forEach(r => {
    const match = !q || r.dataset.search.includes(q) || r.dataset.date.includes(q);
    r.style.display = match ? 'flex' : 'none';
  });
  const dividers = document.querySelectorAll('.month-divider');
  dividers.forEach(dv => dv.style.display = q ? 'none' : 'block');
}

// Auto-scroll to today on load
window.addEventListener('load', () => {
  setTimeout(() => {
    if (todayRowEl) {
      todayRowEl.scrollIntoView({behavior: 'auto', block: 'start'});
      window.scrollBy(0, -20);
    }
  }, 100);
});
