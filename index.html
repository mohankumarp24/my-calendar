<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Calendar">
<meta name="theme-color" id="themeColorMeta" content="#12161C">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>Academic Calendar — PSGIM</title>
<script>
  /* Apply the saved theme before first paint so there's no flash. */
  (function(){
    var t = null;
    try { t = localStorage.getItem('psgim-cal-theme'); } catch(e){}
    if(!t && window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches) t = 'light';
    document.documentElement.setAttribute('data-theme', t || 'dark');
  })();
</script>
<style>
  /* ============ TOKENS (shared with the Sem III timetable) ============ */
  :root{
    --ink:#0B0D12; --panel:#12161C; --panel-soft:#171C23; --panel-raised:#1F252E;
    --line:rgba(255,255,255,0.07); --line-strong:rgba(255,255,255,0.13);
    --text:#EEF0F3; --text-dim:#9AA1AD; --text-faint:#5E6572;
    --amber:#FFB020; --amber-ink:#1A1306; --amber-soft:rgba(255,176,32,0.14); --live:#5FD68A;
    --c-holiday:#FF6B6B; --c-exam:#5B8DEF; --c-placement:#A67CF0; --c-event:#3FBFA5; --c-weekend:#6FBF5B;
    --radius:16px; --safe-b:env(safe-area-inset-bottom, 0px); --hdr:64px;
    --ease:cubic-bezier(.3,.9,.3,1); --spring:cubic-bezier(.34,1.5,.64,1);
  }
  [data-theme="light"]{
    --ink:#ECEEF1; --panel:#FFFFFF; --panel-soft:#F6F7F9; --panel-raised:#E6E9EE;
    --line:rgba(16,22,32,0.07); --line-strong:rgba(16,22,32,0.13);
    --text:#14171C; --text-dim:#5B626E; --text-faint:#98A0AC;
    --amber:#B87400; --amber-ink:#FFFFFF; --amber-soft:rgba(184,116,0,0.12); --live:#17864B;
    --c-holiday:#D64545; --c-exam:#2F6FDB; --c-placement:#7A4FD0; --c-event:#16917B; --c-weekend:#3E9A35;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth;}
  html,body{margin:0; padding:0; background:var(--ink); color:var(--text); font-family:'Inter',-apple-system,sans-serif; font-weight:500;}
  body{transition:background .25s ease, color .25s ease; padding-bottom:calc(78px + var(--safe-b)); overflow-x:hidden;}
  button{font-family:inherit; color:inherit; background:none; border:none; padding:0; -webkit-appearance:none; appearance:none; cursor:pointer; text-align:inherit;}
  input{font-family:inherit;}
  :focus-visible{outline:2px solid var(--amber); outline-offset:2px;}
  ::selection{background:var(--amber); color:#1B1D22;}
  .mono{font-family:'Space Mono', monospace;}
  svg.i{width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; display:block;}
  .sl{color:var(--text-faint); padding:0 1px; font-weight:400;}
  mark{background:var(--amber-soft); color:var(--amber); border-radius:3px; padding:0 1px;}

  /* ============ HEADER ============ */
  header{position:sticky; top:0; z-index:30; background:color-mix(in srgb, var(--panel) 88%, transparent);
    -webkit-backdrop-filter:saturate(1.4) blur(14px); backdrop-filter:saturate(1.4) blur(14px);
    border-bottom:1px solid var(--line); padding:calc(10px + env(safe-area-inset-top, 0px)) 16px 10px;}
  .toprow{display:flex; align-items:center; gap:11px; max-width:640px; margin:0 auto;}
  .mark{width:40px; height:40px; border-radius:12px; flex-shrink:0; background:#0B0D12; border:1px solid rgba(255,255,255,0.12);
    display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden;
    font-family:'Manrope',sans-serif; font-weight:800; font-size:14.5px; color:#F1EFE9; letter-spacing:.3px;
    box-shadow:0 4px 14px rgba(0,0,0,0.28), inset 0 1px 0 rgba(255,255,255,0.08);}
  .mark::after{content:''; position:absolute; left:8px; right:8px; bottom:6px; height:2px; border-radius:2px; background:#FFB020; opacity:.95;}
  .mark::before{content:''; position:absolute; inset:0; background:linear-gradient(115deg, transparent 35%, rgba(255,255,255,.16) 50%, transparent 65%);
    transform:translateX(-120%); animation:mark-sheen 6s ease-in-out 1.2s infinite;}
  @keyframes mark-sheen{0%,70%{transform:translateX(-120%);} 85%,100%{transform:translateX(120%);}}
  .titleblock{flex:1; min-width:0;}
  .titleblock h1{margin:0; font-size:18px; font-weight:800; font-family:'Manrope',sans-serif; line-height:1.1; letter-spacing:-.4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .titleblock .sub{font-size:11px; font-weight:600; color:var(--text-dim); margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .titleblock .sub b{color:var(--amber); font-weight:700;}
  .clock{text-align:right; flex-shrink:0; line-height:1;}
  .clock .t{font-family:'Space Mono',monospace; font-weight:700; font-size:17px; letter-spacing:-.5px; font-variant-numeric:tabular-nums;}
  .clock .t .colon{animation:blink 1s steps(1) infinite;}
  .clock .t small{font-size:9.5px; color:var(--text-dim); margin-left:2px; letter-spacing:0;}
  .clock .d{font-size:10px; color:var(--text-dim); font-weight:600; margin-top:4px;}
  @keyframes blink{50%{opacity:.15;}}
  .icon-btn{width:38px; height:38px; border-radius:11px; border:1px solid var(--line-strong); background:var(--panel-soft);
    color:var(--text); display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:transform .15s ease; overflow:hidden;}
  .icon-btn:active{transform:scale(.92);}
  .icon-btn svg.i{width:18px; height:18px; animation:ico-spin .5s var(--spring) backwards;}
  @keyframes ico-spin{from{transform:rotate(-120deg) scale(.4); opacity:0;}}
  .icon-btn svg.ico-sun{display:none;} [data-theme="light"] .icon-btn svg.ico-sun{display:block;} [data-theme="light"] .icon-btn svg.ico-moon{display:none;}

  main{max-width:640px; margin:0 auto; padding:12px 16px 0;}
  .view{display:none;}
  .view.on{display:block;}
  .view.from-r{animation:view-r .34s var(--ease) backwards;}
  .view.from-l{animation:view-l .34s var(--ease) backwards;}
  @keyframes view-r{from{opacity:0; transform:translateX(18px);}}
  @keyframes view-l{from{opacity:0; transform:translateX(-18px);}}
  .rise{animation:rise .55s var(--ease) backwards; animation-delay:calc(var(--d, 0) * 70ms);}
  @keyframes rise{from{opacity:0; transform:translateY(12px);}}

  /* ============ TODAY BOARD (signature element) ============ */
  .ticker-panel{position:relative; background:linear-gradient(180deg,#0E1116 0%, #08090C 100%); border:1px solid rgba(255,255,255,0.08);
    border-radius:var(--radius); overflow:hidden; margin-bottom:10px; box-shadow:0 10px 30px -12px rgba(0,0,0,.55); isolation:isolate;}
  [data-theme="light"] .ticker-panel{background:linear-gradient(180deg,#1A1E25 0%, #12151A 100%); box-shadow:0 12px 28px -14px rgba(16,22,32,.45);}
  .ticker-panel::before{content:''; position:absolute; top:0; left:0; right:0; height:1.5px; z-index:3; pointer-events:none;
    background:linear-gradient(90deg, transparent, #FFB020, transparent) no-repeat; background-size:35% 100%;
    animation:tk-scan 5.5s linear infinite; opacity:.9;}
  @keyframes tk-scan{from{background-position:-60% 0;} to{background-position:160% 0;}}
  /* slow drifting glow behind the board */
  .ticker-panel::after{content:''; position:absolute; width:220px; height:220px; border-radius:50%; z-index:-1; pointer-events:none;
    background:radial-gradient(circle, color-mix(in srgb, var(--glow, #FFB020) 22%, transparent), transparent 70%);
    top:-110px; left:-60px; animation:drift 14s ease-in-out infinite alternate;}
  @keyframes drift{0%{transform:translate(0,0);} 50%{transform:translate(170px,60px);} 100%{transform:translate(60px,120px);}}

  .ticker-head{display:flex; align-items:stretch; padding:13px 14px 12px;}
  .tk-col{flex:1; min-width:0; display:flex; flex-direction:column; --sc:#3A3F4A;}
  .tk-col + .tk-col{border-left:1px solid rgba(255,255,255,0.08); padding-left:12px; margin-left:12px;}
  .tk-label{font-family:'Space Mono',monospace; font-weight:700; font-size:9px; letter-spacing:1.4px; text-transform:uppercase;
    color:#8A90A0; display:flex; align-items:center; gap:5px; margin-bottom:8px; white-space:nowrap; min-height:20px;}
  .tk-chip{margin-left:auto; font-size:9.5px; letter-spacing:.2px; text-transform:none; color:#D7DAE0;
    background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.10); border-radius:6px; padding:2px 6px;
    font-variant-numeric:tabular-nums;}
  .tk-next.soon .tk-chip{background:#FFB020; color:#14161B; border-color:#FFB020; animation:tk-chip 1.3s ease-out infinite;}
  @keyframes tk-chip{0%{box-shadow:0 0 0 0 rgba(255,176,32,.55);} 100%{box-shadow:0 0 0 7px rgba(255,176,32,0);}}
  .tk-arrow{color:#FFB020; font-size:10px; display:inline-block; animation:tk-nudge 1.4s ease-in-out infinite;}
  @keyframes tk-nudge{0%,100%{transform:translateX(0); opacity:.55;} 50%{transform:translateX(3px); opacity:1;}}

  .live-dot{width:6px; height:6px; border-radius:50%; background:#5FD68A; flex-shrink:0; display:inline-block;}
  .live-dot.amber{background:#FFB020;}
  .live-dot.idle{background:#4A505C;}
  .live-dot.pulsing{animation:pulse 1.6s ease-in-out infinite;}
  .live-dot.amber.pulsing{animation-name:pulse-amber;}
  @keyframes pulse{0%,100%{opacity:1; box-shadow:0 0 0 0 rgba(95,214,138,.5);} 50%{opacity:.6; box-shadow:0 0 0 4px rgba(95,214,138,0);}}
  @keyframes pulse-amber{0%,100%{opacity:1; box-shadow:0 0 0 0 rgba(255,176,32,.5);} 50%{opacity:.6; box-shadow:0 0 0 4px rgba(255,176,32,0);}}

  .tk-body{position:relative; display:block; width:100%; text-align:left; font:inherit; color:inherit; padding:1px 0 1px 11px; margin:0;
    min-width:0; animation:tk-in .5s var(--ease) backwards;}
  .tk-body::before{content:''; position:absolute; left:0; top:1px; bottom:1px; width:3px; border-radius:2px; background:var(--sc);}
  .tk-col.glow .tk-body::before{animation:tk-breathe 2.8s ease-in-out .5s infinite;}
  .tk-next .tk-body{animation-delay:.08s;}
  button.tk-body:active{opacity:.75;}
  @keyframes tk-in{from{opacity:0; transform:translateY(8px);}}
  @keyframes tk-breathe{0%,100%{box-shadow:0 0 4px 0 var(--sc); opacity:.85;} 50%{box-shadow:0 0 12px 2px var(--sc); opacity:1;}}

  .tk-main{font-family:'Space Mono',monospace; font-weight:700; font-size:22px; color:#F5D9A0; line-height:1.05; letter-spacing:-.5px; white-space:nowrap;}
  .tk-main small{font-size:12px; letter-spacing:.5px; color:#C9B184; margin-left:4px;}
  .tk-name{font-family:'Manrope',sans-serif; font-size:12px; font-weight:800; color:#E4E6EB; margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .tk-name i{font-style:normal; color:#7A8190; font-weight:700;}
  .tk-text{font-size:11px; color:#B9BEC8; margin-top:4px; line-height:1.4; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;}
  .tk-text.dim{color:#6F7684; font-style:italic;}
  .tk-text .sl{color:#59606D;}
  .tk-tags{display:flex; flex-wrap:wrap; gap:4px; margin-top:6px;}

  .tk-prog{margin-top:auto; padding-top:10px;}
  .bar{height:4px; border-radius:3px; background:rgba(255,255,255,0.07); overflow:hidden;}
  .bar i{display:block; height:100%; width:0; border-radius:3px; background:var(--sc); position:relative; overflow:hidden;
    box-shadow:0 0 8px var(--sc); transition:width 1s linear;}
  .bar i::after{content:''; position:absolute; inset:0; transform:translateX(-100%);
    background:linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent); animation:shimmer 2.4s ease-in-out infinite;}
  @keyframes shimmer{to{transform:translateX(100%);}}
  .tk-span{display:flex; justify-content:space-between; font-family:'Space Mono',monospace; font-size:8.5px; color:#5F6570; margin-top:4px;}

  .ticker-tape{border-top:1px solid rgba(255,255,255,0.07); background:rgba(255,255,255,0.015); overflow:hidden; white-space:nowrap; padding:7px 0;
    -webkit-mask-image:linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent); mask-image:linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent);}
  .ticker-track{display:inline-block; animation:scroll-left 40s linear infinite; will-change:transform;}
  .ticker-tape:active .ticker-track{animation-play-state:paused;}
  @keyframes scroll-left{from{transform:translateX(0);} to{transform:translateX(-50%);}}
  .tt-item{font-family:'Space Mono',monospace; font-size:10.5px; color:#8A90A0; padding:0 4px; letter-spacing:.2px; display:inline-flex; align-items:center; gap:7px;}
  .tt-item b{color:#F5D9A0; font-weight:700;}
  .tt-item em{font-style:normal; color:#C3C7CF; font-family:'Inter',sans-serif; font-weight:600; font-size:11px;}
  .tt-item .st{font-size:8.5px; font-weight:700; letter-spacing:.8px; padding:1px 5px; border-radius:4px; color:var(--cc); border:1px solid color-mix(in srgb, var(--cc) 55%, transparent);}
  .tt-sep{color:#3A404B; font-size:8px; padding:0 14px; vertical-align:middle;}

  .ctag{display:inline-flex; align-items:center; gap:4px; font-family:'Space Mono',monospace; font-size:8.5px; font-weight:700; letter-spacing:.6px; text-transform:uppercase;
    color:var(--cc); background:color-mix(in srgb, var(--cc) 14%, transparent); border:1px solid color-mix(in srgb, var(--cc) 40%, transparent); border-radius:6px; padding:2px 6px; white-space:nowrap;}
  .ctag::before{content:''; width:5px; height:5px; border-radius:50%; background:var(--cc);}

  /* ============ COUNTDOWN TILES ============ */
  .cd-row{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:10px;}
  .cd-tile{position:relative; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:11px 12px 12px; min-width:0; overflow:hidden;
    display:flex; flex-direction:column; transition:transform .15s ease; isolation:isolate;}
  .cd-tile:active{transform:scale(.97);}
  .cd-tile::before{content:''; position:absolute; inset:0; z-index:-1; background:radial-gradient(120% 80% at 100% 0%, color-mix(in srgb, var(--cc) 16%, transparent), transparent 60%);}
  .cd-k{font-family:'Space Mono',monospace; font-size:8.5px; font-weight:700; letter-spacing:1.3px; text-transform:uppercase; color:var(--text-dim); display:flex; align-items:center; gap:6px;}
  .cd-dot{width:6px; height:6px; border-radius:50%; background:var(--cc); box-shadow:0 0 0 0 var(--cc); animation:cd-ping 2s ease-out infinite;}
  @keyframes cd-ping{0%{box-shadow:0 0 0 0 color-mix(in srgb, var(--cc) 60%, transparent);} 100%{box-shadow:0 0 0 7px transparent;}}
  .cd-big{display:flex; align-items:baseline; gap:5px; margin-top:8px; line-height:1;}
  .cd-big b{font-family:'Space Mono',monospace; font-size:32px; font-weight:700; letter-spacing:-1.5px; color:var(--cc); font-variant-numeric:tabular-nums;}
  .cd-big small{font-size:11px; font-weight:700; color:var(--text-dim);}
  .cd-hms{font-family:'Space Mono',monospace; font-size:11px; font-weight:700; color:var(--text-dim); margin-top:5px; display:flex; height:14px; overflow:hidden; font-variant-numeric:tabular-nums;}
  .cd-hms span{display:inline-block;}
  .cd-hms span.roll{animation:roll .42s var(--ease);}
  @keyframes roll{from{transform:translateY(-100%); opacity:0;}}
  .cd-l{font-family:'Manrope',sans-serif; font-weight:800; font-size:13px; line-height:1.25; margin-top:9px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .cd-date{font-size:10px; color:var(--text-dim); font-weight:600; margin-top:3px;}
  .cd-tile .bar{margin-top:auto; background:var(--panel-raised);}
  .cd-tile .bar-wrap{margin-top:10px;}
  .cd-tile .bar i{background:var(--cc); box-shadow:0 0 8px var(--cc); transition:width 1.2s var(--ease);}
  .cd-tile.live{border-color:color-mix(in srgb, var(--cc) 60%, transparent); box-shadow:0 0 0 1px color-mix(in srgb, var(--cc) 40%, transparent), 0 10px 24px -14px var(--cc);}
  .cd-tile.none .cd-big b{font-size:20px; color:var(--text-faint);}

  /* ============ CARDS ============ */
  .card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:14px 14px 13px; margin-bottom:10px; position:relative;}
  .card-h{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:11px;}
  .card-h .t{font-family:'Manrope',sans-serif; font-weight:800; font-size:13.5px; display:flex; align-items:center; gap:7px;}
  .card-h .m{font-family:'Space Mono',monospace; font-size:10px; color:var(--text-dim); font-weight:700;}

  /* week strip */
  .wk{display:grid; grid-template-columns:repeat(7,1fr); gap:5px;}
  .wk-d{position:relative; display:flex; flex-direction:column; align-items:center; gap:5px; padding:8px 0 9px; border-radius:11px;
    background:var(--panel-soft); border:1px solid var(--line); overflow:hidden; isolation:isolate; transition:transform .15s;
    animation:rise .45s var(--ease) backwards; animation-delay:calc(var(--i) * 45ms + 150ms);}
  .wk-d:active{transform:scale(.93);}
  .wk-d .dn{font-family:'Space Mono',monospace; font-size:8.5px; font-weight:700; letter-spacing:.8px; color:var(--text-faint); text-transform:uppercase;}
  .wk-d .dd{font-family:'Space Mono',monospace; font-size:15px; font-weight:700; line-height:1;}
  .wk-d .dots{display:flex; gap:3px; height:5px;}
  .wk-d .dots i{width:5px; height:5px; border-radius:50%; background:var(--cc);}
  .wk-d.we{background:color-mix(in srgb, var(--c-weekend) 12%, var(--panel-soft));}
  .wk-d.we .dn{color:color-mix(in srgb, var(--c-weekend) 75%, var(--text-dim));}
  .wk-d.hol{background:color-mix(in srgb, var(--c-holiday) 18%, var(--panel-soft)); border-color:color-mix(in srgb, var(--c-holiday) 35%, transparent);}
  .wk-d.hol .dd{color:var(--c-holiday);}
  .wk-d.past{opacity:.45;}
  .wk-d.today{border-color:var(--amber); box-shadow:0 0 0 1px var(--amber), 0 8px 18px -10px var(--amber);}
  .wk-d.today .dn, .wk-d.today .dd{color:var(--amber);}
  .wk-d.today::before{content:''; position:absolute; left:0; right:0; bottom:0; height:var(--dp, 0%); z-index:-1; transition:height 1s linear;
    background:linear-gradient(0deg, color-mix(in srgb, var(--amber) 26%, transparent), color-mix(in srgb, var(--amber) 6%, transparent)); border-top:1px solid color-mix(in srgb, var(--amber) 55%, transparent);}
  .wk-foot{display:flex; justify-content:space-between; font-size:10px; color:var(--text-faint); margin-top:9px; font-weight:600;}
  .wk-foot b{color:var(--text-dim); font-family:'Space Mono',monospace;}

  /* year progress */
  .yr-top{display:flex; justify-content:space-between; align-items:flex-end; gap:10px;}
  .yr-top .t1{font-family:'Manrope',sans-serif; font-weight:800; font-size:16px; letter-spacing:-.3px;}
  .yr-top .t2{font-size:11px; color:var(--text-dim); margin-top:3px; font-weight:600;}
  .yr-top .pct{font-family:'Space Mono',monospace; font-size:28px; color:var(--amber); font-weight:700; line-height:1; letter-spacing:-1px;}
  .yr-top .pct small{font-size:15px;}
  .yr-bar{position:relative; height:8px; background:var(--panel-raised); border-radius:5px; margin:20px 0 6px;}
  .yr-fill{position:absolute; left:0; top:0; bottom:0; width:0; border-radius:5px; overflow:hidden;
    background:linear-gradient(90deg, color-mix(in srgb, var(--amber) 35%, transparent), var(--amber)); transition:width 1.4s var(--ease);}
  .yr-fill::after{content:''; position:absolute; inset:0; transform:translateX(-100%); background:linear-gradient(90deg, transparent, rgba(255,255,255,.5), transparent); animation:shimmer 2.8s ease-in-out 1.4s infinite;}
  .yr-knob{position:absolute; top:50%; left:0; width:14px; height:14px; margin:-7px 0 0 -7px; border-radius:50%; background:var(--amber); border:3px solid var(--panel);
    transition:left 1.4s var(--ease); animation:pulse-amber 1.8s ease-in-out infinite; z-index:2;}
  .yr-hol{position:absolute; top:-9px; width:4px; height:4px; margin-left:-2px; border-radius:50%; background:var(--c-holiday); opacity:.9;}
  .yr-hol.done{opacity:.3;}
  .yr-tick{position:absolute; top:0; bottom:0; width:1px; background:var(--panel);}
  .yr-months{position:relative; height:12px; font-family:'Space Mono',monospace; font-size:8.5px; color:var(--text-faint);}
  .yr-months span{position:absolute; transform:translateX(-50%);}
  .yr-months span.cur{color:var(--amber); font-weight:700;}
  .stats{display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-top:12px;}
  .stat{background:var(--panel-soft); border:1px solid var(--line); border-radius:12px; padding:9px 10px;}
  .stat b{display:block; font-family:'Space Mono',monospace; font-size:19px; font-weight:700; letter-spacing:-.5px; line-height:1; color:var(--cc, var(--text));}
  .stat span{display:block; font-size:9.5px; color:var(--text-dim); font-weight:600; margin-top:5px; line-height:1.25;}

  /* ============ TIMELINE LIST (coming up + key dates) ============ */
  .section-title{font-family:'Manrope',sans-serif; font-weight:800; font-size:13.5px; margin:16px 0 9px; display:flex; align-items:center; gap:7px;}
  .section-title .n{font-family:'Space Mono',monospace; color:var(--text-faint); font-size:10.5px;}
  .tl{position:relative; margin-bottom:14px;}
  .tl::before{content:''; position:absolute; left:7px; top:16px; bottom:16px; width:2px; background:var(--line-strong); border-radius:2px;}
  .tl-item{position:relative; display:flex; align-items:center; gap:11px; padding:8px 10px 8px 26px; border-radius:12px; width:100%; text-align:left; border:1px solid transparent;
    transition:transform .15s, background .2s; animation:rise .45s var(--ease) backwards; animation-delay:calc(var(--i, 0) * 40ms);}
  .tl-item:active{transform:scale(.985); background:var(--panel);}
  .tl-node{position:absolute; left:2px; top:50%; width:12px; height:12px; margin-top:-6px; border-radius:50%; background:var(--ink); border:2px solid var(--cc, var(--text-faint));}
  .tl-item.done{opacity:.5;}
  .tl-item.done .tl-node{background:var(--text-faint); border-color:var(--text-faint);}
  .tl-item.next{background:var(--panel); border-color:color-mix(in srgb, var(--cc) 50%, transparent); margin:4px 0;
    box-shadow:0 10px 24px -14px color-mix(in srgb, var(--cc) 80%, transparent);}
  .tl-item.next .tl-node, .tl-item.live .tl-node{background:var(--cc); animation:node-ping 1.8s ease-out infinite;}
  .tl-item.live{background:color-mix(in srgb, var(--cc) 10%, var(--panel)); border-color:var(--cc); margin:4px 0;}
  @keyframes node-ping{0%{box-shadow:0 0 0 0 color-mix(in srgb, var(--cc) 60%, transparent);} 100%{box-shadow:0 0 0 8px transparent;}}
  .tl-date{flex-shrink:0; width:46px; text-align:center; line-height:1;}
  .tl-date b{display:block; font-family:'Space Mono',monospace; font-size:18px; font-weight:700; letter-spacing:-.5px;}
  .tl-date b small{font-size:11px; letter-spacing:0;}
  .tl-date span{display:block; font-size:9px; color:var(--text-dim); font-weight:700; margin-top:4px; text-transform:uppercase; letter-spacing:.4px;}
  .tl-body{flex:1; min-width:0;}
  .tl-label{font-family:'Manrope',sans-serif; font-weight:700; font-size:12.5px; line-height:1.35; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .tl-when{font-family:'Space Mono',monospace; font-size:9.5px; color:var(--text-dim); margin-top:4px; display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
  .tl-item.next .tl-when, .tl-item.soon .tl-when{color:var(--amber); font-weight:700;}
  .tl-item.live .tl-when{color:var(--live); font-weight:700;}
  .tl-today{position:relative; display:flex; align-items:center; gap:8px; padding:6px 0 6px 26px; font-family:'Space Mono',monospace; font-size:9.5px; font-weight:700; color:var(--amber); letter-spacing:.4px;}
  .tl-today::before{content:''; position:absolute; left:0; top:50%; width:16px; height:2px; background:var(--amber); margin-top:-1px; box-shadow:0 0 6px var(--amber);}
  .tl-today::after{content:''; flex:1; height:1px; background:linear-gradient(90deg, color-mix(in srgb, var(--amber) 50%, transparent), transparent);}
  .tl-month{font-family:'Space Mono',monospace; font-size:9.5px; font-weight:700; letter-spacing:1.4px; color:var(--text-faint); text-transform:uppercase; padding:10px 0 4px 26px;}
  .empty-note{text-align:center; color:var(--text-faint); font-size:12px; padding:26px 10px; line-height:1.6;}

  /* ============ CONTROLS ============ */
  .seg{position:relative; display:grid; grid-auto-flow:column; grid-auto-columns:1fr; background:var(--panel); border:1px solid var(--line-strong);
    border-radius:11px; padding:3px; height:36px;}
  .seg-thumb{position:absolute; top:3px; bottom:3px; left:3px; width:calc((100% - 6px) / var(--n)); background:var(--amber); border-radius:8px;
    transform:translateX(calc(var(--k) * 100%)); transition:transform .38s var(--spring); box-shadow:0 2px 10px -2px color-mix(in srgb, var(--amber) 60%, transparent);}
  .seg button{position:relative; z-index:1; font-size:11.5px; font-weight:700; color:var(--text-dim); transition:color .25s; text-align:center;}
  .seg button.active{color:var(--amber-ink);}
  .legend{display:flex; flex-wrap:wrap; gap:5px; margin-bottom:10px;}
  .chip{display:flex; align-items:center; gap:5px; padding:0 9px; height:28px; border-radius:999px; border:1px solid var(--line-strong);
    background:var(--panel); font-size:10.5px; font-weight:700; color:var(--text-dim); transition:background .2s, border-color .2s, color .2s, transform .12s;}
  .chip:active{transform:scale(.94);}
  .chip .sw{width:7px; height:7px; border-radius:50%; flex-shrink:0; background:var(--cc);}
  .chip em{font-style:normal; font-family:'Space Mono',monospace; font-size:9px; color:var(--text-faint);}
  .chip.active{color:var(--text); border-color:var(--cc, var(--amber)); background:color-mix(in srgb, var(--cc, var(--amber)) 20%, var(--panel));}
  .chip.active em{color:var(--text-dim);}
  .chip.all.active{background:var(--amber); color:var(--amber-ink); border-color:var(--amber);}
  .pill-btn{display:inline-flex; align-items:center; gap:6px; background:var(--amber-soft); border:1px solid color-mix(in srgb, var(--amber) 45%, transparent);
    color:var(--amber); border-radius:10px; padding:0 12px; font-size:11.5px; font-weight:700; height:34px; transition:transform .15s ease, opacity .25s;}
  .pill-btn:active{transform:scale(.95);}
  .pill-btn .live-dot{background:var(--amber); animation:pulse-amber 1.6s ease-in-out infinite;}

  /* ============ MONTH VIEW ============ */
  .mh{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
  .nav-arrow{width:38px; height:38px; border-radius:11px; border:1px solid var(--line-strong); background:var(--panel); display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:transform .15s, opacity .2s;}
  .nav-arrow:active{transform:scale(.9);}
  .nav-arrow:disabled{opacity:.3; pointer-events:none;}
  .nav-arrow svg.i{width:17px; height:17px;}
  .mh-title{flex:1; min-width:0; overflow:hidden;}
  .mh-title .mt{font-family:'Manrope',sans-serif; font-weight:800; font-size:21px; letter-spacing:-.6px; line-height:1.05; white-space:nowrap;}
  .mh-title .mt span{color:var(--text-faint); font-weight:700;}
  .mh-title .ms{font-size:10.5px; color:var(--text-dim); font-weight:600; margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .mh-title .ms b{font-family:'Space Mono',monospace; color:var(--text);}
  .mh-title.swap{animation:title-swap .35s var(--ease) backwards;}
  @keyframes title-swap{from{opacity:0; transform:translateY(-8px);}}
  .mh-today{display:flex; justify-content:flex-end; margin:-2px 0 10px;}

  .cal-card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:10px 8px 9px; margin-bottom:10px; position:relative; overflow:hidden;}
  .dow{display:grid; grid-template-columns:repeat(7,1fr); gap:5px; margin-bottom:7px;}
  .dow span{text-align:center; font-family:'Space Mono',monospace; font-size:9px; font-weight:700; letter-spacing:1px; color:var(--text-faint);}
  .dow span.we{color:color-mix(in srgb, var(--c-weekend) 80%, var(--text-dim));}
  .cal-vp{touch-action:pan-y; overflow:hidden;}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:5px; will-change:transform;}
  .cal-grid.in-next{animation:slide-next .42s var(--ease) backwards;}
  .cal-grid.in-prev{animation:slide-prev .42s var(--ease) backwards;}
  @keyframes slide-next{from{transform:translateX(35%); opacity:0;}}
  @keyframes slide-prev{from{transform:translateX(-35%); opacity:0;}}
  .cell{--bg:var(--panel-soft); position:relative; aspect-ratio:1/1.08; border-radius:11px; background:var(--bg); border:1px solid var(--line);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; overflow:hidden; isolation:isolate;
    transition:transform .15s, border-color .2s, box-shadow .2s, opacity .3s; animation:cell-in .42s var(--ease) backwards; animation-delay:calc(var(--i) * 9ms);}
  @keyframes cell-in{from{opacity:0; transform:translateY(7px) scale(.92);}}
  .cell:active{transform:scale(.9);}
  .cell .cn{font-family:'Space Mono',monospace; font-weight:700; font-size:14px; line-height:1; position:relative; z-index:2;}
  .cell .cd{display:flex; gap:3px; height:4px; position:relative; z-index:2;}
  .cell .cd i{width:10px; height:3px; border-radius:2px; background:var(--cc); transition:opacity .25s;}
  .cell .cd i:only-child{width:14px;}
  .cell.we{--bg:color-mix(in srgb, var(--c-weekend) 12%, var(--panel-soft));}
  .cell.we2{--bg:color-mix(in srgb, var(--c-weekend) 22%, var(--panel-soft));}
  .cell.we .cn, .cell.we2 .cn{color:color-mix(in srgb, var(--c-weekend) 50%, var(--text));}
  .cell.hol{--bg:color-mix(in srgb, var(--c-holiday) 22%, var(--panel-soft)); border-color:color-mix(in srgb, var(--c-holiday) 40%, transparent);}
  .cell.hol .cn{color:color-mix(in srgb, var(--c-holiday) 70%, var(--text));}
  .cell.past{opacity:.5;}
  .cell.other{opacity:.18; pointer-events:none; background:transparent; border-style:dashed;}
  .cell.nodata{opacity:.35; pointer-events:none; background:repeating-linear-gradient(135deg, var(--panel-soft) 0 4px, transparent 4px 8px);}
  .cell.dim .cd i{opacity:.15;}
  .cell.dim{opacity:.35;}
  .cell.sel{border-color:var(--text); box-shadow:inset 0 0 0 1px var(--text);}
  .cell.today{border-color:transparent; box-shadow:0 0 18px -4px color-mix(in srgb, var(--amber) 75%, transparent); opacity:1;}
  .cell.today::before{content:''; position:absolute; inset:-60%; z-index:0;
    background:conic-gradient(from 0deg, transparent 0 50%, color-mix(in srgb, var(--amber) 40%, transparent) 65%, var(--amber) 80%, #FFE6A8 84%, var(--amber) 88%, transparent 100%);
    animation:spin 2.6s linear infinite;}
  .cell.today::after{content:''; position:absolute; inset:2px; border-radius:9px; background:var(--bg); z-index:1;}
  .cell.today .cn{color:var(--amber);}
  @keyframes spin{to{transform:rotate(360deg);}}
  .cal-hint{display:flex; justify-content:center; align-items:center; gap:8px; font-size:9.5px; color:var(--text-faint); margin-top:9px; font-weight:600;}
  .cal-hint .sw-hand{display:inline-block; animation:hint-swipe 2.4s ease-in-out infinite;}
  @keyframes hint-swipe{0%,100%{transform:translateX(-4px);} 50%{transform:translateX(4px);}}
  .cal-dots{display:flex; justify-content:center; gap:4px; margin-top:8px;}
  .cal-dots i{width:5px; height:5px; border-radius:3px; background:var(--line-strong); transition:width .35s var(--spring), background .3s;}
  .cal-dots i.on{width:16px; background:var(--amber);}

  .detail{position:relative; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:13px 14px; margin-bottom:10px; overflow:hidden; --sc:var(--line-strong);}
  .detail::before{content:''; position:absolute; left:0; top:12px; bottom:12px; width:3px; border-radius:0 3px 3px 0; background:var(--sc); box-shadow:0 0 10px var(--sc);}
  .detail.swap .dt-in{animation:rise .35s var(--ease) backwards;}
  .dt-head{display:flex; align-items:center; gap:11px;}
  .dt-date{flex-shrink:0; width:46px; height:46px; border-radius:12px; background:var(--panel-raised); display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1;}
  .dt-date b{font-family:'Space Mono',monospace; font-size:19px; font-weight:700; letter-spacing:-.5px;}
  .dt-date span{font-size:8.5px; font-weight:800; color:var(--amber); letter-spacing:.6px; margin-top:3px;}
  .dt-t{flex:1; min-width:0;}
  .dt-t .a{font-family:'Manrope',sans-serif; font-weight:800; font-size:15px; letter-spacing:-.2px;}
  .dt-t .b{font-family:'Space Mono',monospace; font-size:10px; color:var(--text-dim); margin-top:3px;}
  .dt-t .b.hot{color:var(--amber);}
  .dt-share{width:34px; height:34px; border-radius:10px; background:var(--panel-raised); display:flex; align-items:center; justify-content:center; color:var(--text-dim); flex-shrink:0; transition:transform .15s;}
  .dt-share:active{transform:scale(.9);}
  .dt-share svg.i{width:16px; height:16px;}
  .dt-text{font-size:13px; line-height:1.55; margin-top:11px;}
  .dt-text.dim{color:var(--text-faint); font-style:italic;}
  .dt-tags{display:flex; flex-wrap:wrap; gap:5px; margin-top:10px;}

  .mlist{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; margin-bottom:12px;}
  .ml-row{position:relative; display:flex; align-items:center; gap:10px; width:100%; text-align:left; padding:10px 12px 10px 14px; border-bottom:1px solid var(--line); transition:background .2s;}
  .ml-row:last-child{border-bottom:none;}
  .ml-row::before{content:''; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--cc);}
  .ml-row.sel{background:color-mix(in srgb, var(--cc) 10%, var(--panel));}
  .ml-row.past{opacity:.5;}
  .ml-d{flex-shrink:0; width:38px; text-align:center; line-height:1;}
  .ml-d b{display:block; font-family:'Space Mono',monospace; font-size:15px; font-weight:700;}
  .ml-d span{display:block; font-size:8.5px; color:var(--text-dim); font-weight:700; margin-top:3px; text-transform:uppercase;}
  .ml-t{flex:1; min-width:0; font-size:12px; line-height:1.4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}

  /* ============ AGENDA ============ */
  .searchwrap{position:relative; margin-bottom:10px;}
  .searchwrap > svg.i{position:absolute; left:13px; top:50%; margin-top:-9px; width:18px; height:18px; color:var(--text-faint); pointer-events:none; transition:color .2s;}
  .searchwrap:focus-within > svg.i{color:var(--amber);}
  .searchbox{width:100%; padding:0 40px; height:46px; border-radius:13px; border:1px solid var(--line-strong); background:var(--panel);
    color:var(--text); font-size:13.5px; transition:border-color .2s, box-shadow .2s;}
  .searchbox::placeholder{color:var(--text-faint);}
  .searchbox::-webkit-search-cancel-button, .searchbox::-webkit-search-decoration{-webkit-appearance:none; appearance:none; display:none;}
  .searchbox:focus{outline:none; border-color:var(--amber); box-shadow:0 0 0 3px var(--amber-soft);}
  .search-clear{position:absolute; right:8px; top:50%; margin-top:-15px; width:30px; height:30px; border-radius:50%; display:none; align-items:center; justify-content:center; color:var(--text-dim);}
  .search-clear.show{display:flex;}
  .search-clear svg.i{width:15px; height:15px;}
  .ag-ctrl{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
  .ag-ctrl .seg{width:168px; flex-shrink:0;}
  .ag-count{flex:1; text-align:right; font-family:'Space Mono',monospace; font-size:10px; color:var(--text-dim); font-weight:700;}
  .ag-month{position:sticky; top:var(--hdr); z-index:5; display:flex; align-items:baseline; justify-content:space-between; padding:12px 2px 8px; margin:0 -2px;
    background:linear-gradient(180deg, var(--ink) 75%, transparent);}
  .ag-month .t{font-family:'Manrope',sans-serif; font-weight:800; font-size:14px; letter-spacing:-.2px;}
  .ag-month .t span{color:var(--text-faint); font-weight:700;}
  .ag-month .n{font-family:'Space Mono',monospace; font-size:9.5px; color:var(--text-faint); font-weight:700;}
  .ag-list{display:flex; flex-direction:column; gap:5px;}
  .ag-row{position:relative; display:flex; align-items:center; gap:10px; background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:9px 10px 9px 0; min-height:52px; width:100%; text-align:left; overflow:hidden; transition:transform .12s, opacity .4s, translate .5s var(--ease);}
  .ag-row:active{transform:scale(.985);}
  .ag-row.rv{opacity:0; translate:0 10px;}
  .ag-row.rv.in{opacity:1; translate:0 0;}
  .ag-row.rv.in.past{opacity:.5;}
  .ag-row.past{opacity:.5;}
  .ag-row.we{background:color-mix(in srgb, var(--c-weekend) 8%, var(--panel));}
  .ag-row.we2{background:color-mix(in srgb, var(--c-weekend) 14%, var(--panel));}
  .ag-row.hol{background:color-mix(in srgb, var(--c-holiday) 12%, var(--panel)); border-color:color-mix(in srgb, var(--c-holiday) 30%, transparent);}
  .ag-row.empty{min-height:38px; padding-top:5px; padding-bottom:5px;}
  .ag-row.today{border-color:var(--amber); box-shadow:0 0 0 1px var(--amber), 0 10px 24px -12px color-mix(in srgb, var(--amber) 70%, transparent); opacity:1 !important;}
  .ag-row.today::after{content:''; position:absolute; top:0; bottom:0; width:40%; left:0; pointer-events:none;
    background:linear-gradient(90deg, transparent, color-mix(in srgb, var(--amber) 14%, transparent), transparent); animation:sweep 3.2s ease-in-out infinite;}
  @keyframes sweep{from{transform:translateX(-100%);} to{transform:translateX(260%);}}
  .ag-d{flex-shrink:0; width:50px; text-align:center; line-height:1; border-right:1px dashed var(--line-strong); padding:2px 0;}
  .ag-d b{display:block; font-family:'Space Mono',monospace; font-size:17px; font-weight:700; letter-spacing:-.5px;}
  .ag-d span{display:block; font-size:9px; font-weight:700; color:var(--text-dim); margin-top:3px; text-transform:uppercase; letter-spacing:.5px;}
  .ag-row.empty .ag-d b{font-size:13px; color:var(--text-dim);}
  .ag-row.empty .ag-d span{margin-top:2px;}
  .ag-row.we .ag-d span, .ag-row.we2 .ag-d span{color:color-mix(in srgb, var(--c-weekend) 75%, var(--text-dim));}
  .ag-row.hol .ag-d b{color:var(--c-holiday);}
  .ag-row.today .ag-d b, .ag-row.today .ag-d span{color:var(--amber);}
  .ag-b{flex:1; min-width:0;}
  .ag-t{font-size:12.5px; line-height:1.45;}
  .ag-t .cdot{display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--cc); margin-right:7px; vertical-align:1px; box-shadow:0 0 6px var(--cc);}
  .ag-row.empty .ag-t{font-size:11px; color:var(--text-faint); font-style:italic;}
  .tag{flex-shrink:0; font-family:'Space Mono',monospace; font-size:8.5px; font-weight:700; letter-spacing:.5px; border-radius:6px; padding:3px 6px;}
  .tag.now{color:#0B0D12; background:var(--amber);}
  .ag-today-line{position:relative; display:flex; align-items:center; gap:8px; padding:4px 2px; font-family:'Space Mono',monospace; font-size:9.5px; font-weight:700; color:var(--amber); letter-spacing:.4px;}
  .ag-today-line::after{content:''; flex:1; height:1px; background:linear-gradient(90deg, var(--amber), transparent);}
  .ag-foot{font-size:10px; color:var(--text-faint); text-align:center; margin:18px 0 8px; line-height:1.6;}
  .ag-foot i{display:inline-block; width:8px; height:8px; border-radius:2px; vertical-align:-1px; margin:0 3px 0 8px;}

  .jump-fab{position:fixed; right:16px; bottom:calc(84px + var(--safe-b)); z-index:35; height:44px; padding:0 15px 0 12px; border-radius:22px;
    background:var(--amber); color:var(--amber-ink); display:flex; align-items:center; gap:7px; font-size:12px; font-weight:800;
    box-shadow:0 10px 24px -8px color-mix(in srgb, var(--amber) 70%, transparent), 0 2px 6px rgba(0,0,0,.25);
    transform:translateY(20px) scale(.8); opacity:0; pointer-events:none; transition:transform .35s var(--spring), opacity .25s;}
  .jump-fab.show{transform:none; opacity:1; pointer-events:auto;}
  .jump-fab:active{transform:scale(.93);}
  .jump-fab svg.i{width:17px; height:17px; transition:transform .35s var(--spring);}
  .jump-fab.up svg.i{transform:rotate(180deg);}
  @media (min-width:700px){ .jump-fab{right:calc(50% - 304px);} }

  /* ============ BOTTOM SHEET ============ */
  .sheet-overlay{position:fixed; inset:0; background:rgba(4,6,10,0.6); -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px);
    z-index:50; opacity:0; pointer-events:none; transition:opacity .25s ease;}
  .sheet-overlay.open{opacity:1; pointer-events:auto;}
  .sheet{position:fixed; left:0; right:0; bottom:0; z-index:51; background:var(--panel); border-radius:22px 22px 0 0;
    padding:10px 18px calc(18px + var(--safe-b)); max-width:640px; margin:0 auto; transform:translateY(100%); transition:transform .42s var(--spring);
    border-top:1px solid var(--line-strong); max-height:86vh; overflow-y:auto; overflow-x:hidden; --sc:var(--amber); touch-action:pan-y;}
  .sheet.dragging{transition:none;}
  .sheet::before{content:''; position:absolute; top:0; left:22px; right:22px; height:3px; border-radius:0 0 3px 3px; background:var(--sc); box-shadow:0 0 12px var(--sc); transition:background .3s;}
  .sheet-overlay.open .sheet{transform:translateY(0);}
  .sheet-handle{width:38px; height:4px; border-radius:3px; background:var(--line-strong); margin:4px auto 14px;}
  .sh-in.from-r{animation:view-r .3s var(--ease) backwards;}
  .sh-in.from-l{animation:view-l .3s var(--ease) backwards;}

const CATS = {
  holiday:  {label:'Holiday',   color:'var(--c-holiday)',   re:/holiday|holiay/i},
  exam:     {label:'Exam',      color:'var(--c-exam)',      re:/exam/i},
  placement:{label:'Placement', color:'var(--c-placement)', re:/placement|internship|\bgip\b|induction/i},
  event:    {label:'Event',     color:'var(--c-event)'}
};
const CAT_KEYS = ['holiday','exam','placement','event'];
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const DOWL = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const DAY_MS = 86400000;
const TABS = ['today','month','agenda','dates'];

const pad = n => String(n).padStart(2,'0');
function parseD(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function dkey(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function dayDiff(a, b){ return Math.round((b - a) / DAY_MS); }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function classify(t){
  const tags = ['holiday','exam','placement'].filter(c => CATS[c].re.test(t));
  if(!tags.length && t) tags.push('event');
  return tags;
}

const DAYS = RAW.map((r, i) => {
  const d = parseD(r[0]);
  const text = r[1].replace(/\s*\n\s*/g, ' ').replace(/\s*\/\s*/g, ' / ').replace(/\s{2,}/g, ' ').replace(/^\s*\/\s*|\s*\/\s*$/g, '').trim();
  const tags = classify(text);
  return {i, key:r[0], d, dow:d.getDay(), text, shade:r[2], tags, cat:tags[0] || null, wknd:d.getDay()===0 || d.getDay()===6};
});
const BY_KEY = Object.fromEntries(DAYS.map(x => [x.key, x]));
const START = DAYS[0].d, END = DAYS[DAYS.length-1].d;
const TOTAL_WEEKS = Math.floor(dayDiff(START, END) / 7) + 1;

function cleanHoliday(t){ return t.replace(/^(holiday|holiay)\s*[-–:]?\s*/i, '').trim() || 'Holiday'; }
/* For combined entries ("A / B"), the part that mentions the keyword. */
function keySegment(t, kind){
  const re = CATS[kind].re;
  return t.split(' / ').find(p => re.test(p)) || t;
}
function catColor(x){ return x && x.cat ? CATS[x.cat].color : null; }

/* Consecutive days with identical text collapse into one range ("21–23 Sep"). */
function buildRanges(pred){
  const out = [];
  for(const x of DAYS){
    if(!pred(x)) continue;
    const last = out[out.length-1];
    if(last && last.text === x.text && x.i === last.end.i + 1){ last.end = x; last.days++; }
    else out.push({start:x, end:x, text:x.text, days:1, cat:x.cat, tags:x.tags});
  }
  return out;
}
const RANGES = {
  holiday:   buildRanges(x => x.tags.includes('holiday')),
  exam:      buildRanges(x => x.tags.includes('exam')),
  placement: buildRanges(x => x.tags.includes('placement')),
  all:       buildRanges(x => !!x.text)
};

/* ================= TIME ================= */
/* ?d=YYYY-MM-DD previews the app as if it were that date (clock keeps ticking). */
let OFFSET = 0;
(function(){
  const q = new URLSearchParams(location.search).get('d');
  if(q && /^\d{4}-\d{2}-\d{2}$/.test(q)){
    const n = new Date(), t = parseD(q);
    t.setHours(n.getHours(), n.getMinutes(), n.getSeconds(), n.getMilliseconds());
    OFFSET = t - n;
  }
})();
function now(){ return new Date(Date.now() + OFFSET); }
let T0, TKEY, PHASE;
function computeToday(){
  const n = now();
  T0 = new Date(n.getFullYear(), n.getMonth(), n.getDate());
  TKEY = dkey(T0);
  PHASE = T0 < START ? 'before' : T0 > END ? 'after' : 'during';
}
computeToday();

function relDays(n){
  if(n === 0) return 'Today';
  if(n === 1) return 'Tomorrow';
  if(n === -1) return 'Yesterday';
  return n > 0 ? `in ${n} days` : `${-n} days ago`;
}
function fmtDur(sec){
  sec = Math.max(0, Math.floor(sec));
  const d = Math.floor(sec/86400), h = Math.floor(sec%86400/3600), m = Math.floor(sec%3600/60), s = sec%60;
  if(d > 0) return `${d}d ${h}h ${pad(m)}m`;
  if(h > 0) return `${h}h ${pad(m)}m`;
  return `${m}:${pad(s)}`;
}
function shortDate(d){ return `${DOW[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`; }
function rangeLabel(r){
  const a = r.start.d, b = r.end.d;
  if(r.days === 1) return shortDate(a);
  if(a.getMonth() === b.getMonth()) return `${DOW[a.getDay()]}–${DOW[b.getDay()]} · ${a.getDate()}–${b.getDate()} ${MON[a.getMonth()]}`;
  return `${a.getDate()} ${MON[a.getMonth()]} – ${b.getDate()} ${MON[b.getMonth()]}`;
}
function weekNo(d){ return Math.floor(dayDiff(START, d) / 7) + 1; }

/* Text with styled "/" separators and optional search highlight. */
function fmtText(t, q){
  let s = esc(t).replace(/ \/ /g, '\u0001');
  if(q){
    const qq = esc(q).replace(/ ?\/ ?/g, '\u0001').replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    try { s = s.replace(new RegExp(qq, 'gi'), m => `<mark>${m}</mark>`); } catch(e){}
  }
  return s.replace(/\u0001/g, ' <span class="sl">/</span> ');
}
function ctags(tags){ return tags.map(t => `<span class="ctag" style="--cc:${CATS[t].color}">${CATS[t].label}</span>`).join(''); }
function vib(ms){ try { if(navigator.vibrate) navigator.vibrate(ms || 6); } catch(e){} }

/* Count-up for numbers when they first appear. */
function countUp(el, to, opts){
  opts = opts || {};
  const dur = opts.dur || 900, suffix = opts.suffix || '';
  if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches){ el.innerHTML = to + suffix; return; }
  const t0 = performance.now();
  function step(t){
    const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3);
    el.innerHTML = Math.round(to * e) + suffix;
    if(p < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}
/* Digit-roll text: only the characters that changed animate in. */
function setRoll(el, str){
  if(!el || el.dataset.v === str) return;
  const prev = el.dataset.v || '';
  el.dataset.v = str;
  if(prev.length !== str.length){ el.innerHTML = [...str].map(c => `<span>${c}</span>`).join(''); return; }
  [...str].forEach((c, i) => {
    if(prev[i] === c) return;
    const sp = el.children[i]; if(!sp) return;
    sp.textContent = c; sp.classList.remove('roll'); void sp.offsetWidth; sp.classList.add('roll');
  });
}

  const lo = new Date(START.getFullYear(), START.getMonth(), 1), hi = new Date(END.getFullYear(), END.getMonth(), 1);

function nextEventAfter(key){
  const from = BY_KEY[key] ? BY_KEY[key].i + 1 : (T0 < START ? 0 : DAYS.length);
  for(let i = from; i < DAYS.length; i++) if(DAYS[i].text) return DAYS[i];
  return null;
}
function renderBoard(){
  const el = document.getElementById('boardHead');
  const td = BY_KEY[TKEY];

function tickBoard(){
  const el = document.getElementById('boardHead'); if(!el) return;

  const frac = Math.min(1, Math.max(0, (n - T0) / DAY_MS));
  const bar = el.querySelector('[data-b="day"]'); if(bar) bar.style.width = (frac*100).toFixed(2) + '%';
  const pct = el.querySelector('[data-b="dayPct"]'); if(pct) pct.textContent = Math.floor(frac*100) + '% of day';
  const nk = el.dataset.next;
  if(nk){
    const secs = (BY_KEY[nk].d - n) / 1000;
    const chip = el.querySelector('[data-b="nextChip"]'); if(chip) chip.textContent = 'in ' + fmtDur(secs);
    const col = el.querySelector('.tk-next'); if(col) col.classList.toggle('soon', secs <= 12*3600);
  }
  const wd = document.querySelector('.wk-d.today'); if(wd) wd.style.setProperty('--dp', (frac*100).toFixed(1) + '%');
}

/* ================= TODAY: TICKER TAPE ================= */
function renderTicker(){
  const track = document.getElementById('tickerTrack');
  const lim = new Date(T0.getTime() + 21*DAY_MS);
  const items = RANGES.all.filter(r => r.end.d >= T0 && r.start.d <= lim).slice(0, 10).map(r => {
    const live = r.start.d <= T0;
    const when = live ? 'NOW' : `${DOW[r.start.dow].toUpperCase()} ${r.start.d.getDate()} ${MON[r.start.d.getMonth()].toUpperCase()}`;
    const t = r.text.length > 70 ? r.text.slice(0, 68).trim() + '…' : r.text;
    return `<span class="tt-item"><b>${when}</b><em>${esc(t)}</em><span class="st" style="--cc:${CATS[r.cat].color}">${CATS[r.cat].label.toUpperCase()}</span></span>`;
  });
  if(!items.length) items.push(`<span class="tt-item"><em>Nothing on the calendar for the next three weeks</em></span>`);
  const reps = Math.max(1, Math.ceil(4 / items.length));
  let seq = []; for(let r = 0; r < reps; r++) seq = seq.concat(items);
  const half = seq.join('<span class="tt-sep">◆</span>') + '<span class="tt-sep">◆</span>';
  track.innerHTML = half + half;
  requestAnimationFrame(() => {
    const w = track.scrollWidth / 2;
    if(w > 0) track.style.animationDuration = Math.max(18, w / 40).toFixed(1) + 's';
  });
}

/* ================= TODAY: COUNTDOWNS ================= */
const CD = {};
function renderCountdowns(){
  const el = document.getElementById('cdRow');
  el.innerHTML = ['holiday','exam'].map(kind => {
    const list = RANGES[kind];
    const nx = list.find(r => r.end.d >= T0);

    if(!nx){
      CD[kind] = null;
      return `<div class="cd-tile none" style="--cc:${CATS[kind].color}"><div class="cd-k"><span class="cd-dot"></span>${title}</div>
        <div class="cd-big"><b>—</b></div><div class="cd-l">None left this year</div></div>`;
    }
    const prev = [...list].reverse().find(r => r.end.d < T0);
    const from = prev ? new Date(prev.end.d.getTime() + DAY_MS) : START;
    CD[kind] = {nx, from};
    const seg = keySegment(nx.text, kind);
    const label = kind === 'holiday' ? cleanHoliday(seg) : seg;
    return `<button class="cd-tile" id="cd-${kind}" style="--cc:${CATS[kind].color}" onclick="openSheet('${nx.start.key}')">

  }).join('');

    const live = c.nx.start.d <= T0;
    tile.classList.toggle('live', live);
    const big = tile.querySelector('[data-cd="d"]');
    if(live){ big.textContent = c.nx.days > 1 ? 'On' : 'Today'; tile.querySelector('[data-cd="u"]').textContent = c.nx.days > 1 ? `till ${shortDate(c.nx.end.d)}` : ''; }
    else countUp(big, dayDiff(T0, c.nx.start.d), {dur:1100});

      const total = c.nx.start.d - c.from, done = now() - c.from;

function tickCountdowns(){
  ['holiday','exam'].forEach(kind => {
    const c = CD[kind]; if(!c) return;
    const tile = document.getElementById('cd-' + kind); if(!tile) return;
    const hms = tile.querySelector('[data-cd="hms"]');

    const secs = Math.max(0, Math.floor((c.nx.start.d - now()) / 1000));
    const h = Math.floor(secs % 86400 / 3600), m = Math.floor(secs % 3600 / 60), s = secs % 60;
    setRoll(hms, `${pad(h)}h\u00a0${pad(m)}m\u00a0${pad(s)}s`);
  });
}

/* ================= TODAY: WEEK STRIP ================= */
function renderWeek(){
  const el = document.getElementById('weekCard');
  let anchor = T0 < START ? START : T0 > END ? END : T0;
  const mon = new Date(anchor.getFullYear(), anchor.getMonth(), anchor.getDate() - ((anchor.getDay() + 6) % 7));

    const d = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + i), k = dkey(d), x = BY_KEY[k];

    if(x && x.text) evCount++;
    const cls = ['wk-d', x && x.wknd ? 'we' : '', x && (x.shade === 3 || x.tags.includes('holiday')) ? 'hol' : '', isToday ? 'today' : '', past ? 'past' : ''].join(' ');

/* ================= TODAY: YEAR PROGRESS ================= */
function renderYear(){
  const el = document.getElementById('yearCard');
  const span = END - START + DAY_MS;
  const pct = PHASE === 'before' ? 0 : PHASE === 'after' ? 100 : Math.min(100, (now() - START) / span * 100);
  const dayN = PHASE === 'during' ? BY_KEY[TKEY].i + 1 : PHASE === 'after' ? DAYS.length : 0;
  const future = DAYS.filter(x => x.d >= T0);
  const working = future.filter(x => !x.wknd && !x.tags.includes('holiday') && x.shade !== 3).length;
  const hols = RANGES.holiday.filter(r => r.end.d >= T0).length;
  const exams = future.filter(x => x.tags.includes('exam')).length;
  let months = '', ticks = '';
  for(let m = new Date(START.getFullYear(), START.getMonth(), 1); m <= END; m = new Date(m.getFullYear(), m.getMonth() + 1, 1)){
    const mid = new Date(m.getFullYear(), m.getMonth(), 15);
    const pos = Math.max(2, Math.min(98, (mid - START) / span * 100));
    const cur = m.getMonth() === T0.getMonth() && m.getFullYear() === T0.getFullYear();
    months += `<span class="${cur ? 'cur' : ''}" style="left:${pos}%">${MON[m.getMonth()][0]}</span>`;
    if(m > START) ticks += `<span class="yr-tick" style="left:${(m - START) / span * 100}%"></span>`;
  }
  const holDots = RANGES.holiday.map(r => `<span class="yr-hol ${r.end.d < T0 ? 'done' : ''}" style="left:${(r.start.d - START + DAY_MS/2) / span * 100}%"></span>`).join('');
  const status = PHASE === 'during' ? `Day ${dayN} of ${DAYS.length} · ${DAYS.length - dayN} days to go` : PHASE === 'before' ? `Starts ${shortDate(START)}` : `Ended ${shortDate(END)}`;
  el.innerHTML = `<div class="yr-top">
      <div><div class="t1">Academic year</div><div class="t2">${status}</div></div>
      <div class="pct"><span id="yrPct">0</span><small>%</small></div>
    </div>
    <div class="yr-bar">${ticks}${holDots}<div class="yr-fill" id="yrFill"></div><span class="yr-knob" id="yrKnob"></span></div>
    <div class="yr-months">${months}</div>
    <div class="stats">
      <div class="stat"><b data-n="${working}">0</b><span>Working days left</span></div>
      <div class="stat" style="--cc:var(--c-holiday)"><b data-n="${hols}">0</b><span>Holidays to come</span></div>
      <div class="stat" style="--cc:var(--c-exam)"><b data-n="${exams}">0</b><span>Exam days ahead</span></div>
    </div>`;
  countUp(document.getElementById('yrPct'), Math.round(pct), {dur:1400});
  el.querySelectorAll('[data-n]').forEach(b => countUp(b, +b.dataset.n, {dur:1100}));
  requestAnimationFrame(() => requestAnimationFrame(() => {
    document.getElementById('yrFill').style.width = pct + '%';
    document.getElementById('yrKnob').style.left = pct + '%';
  }));
}

function monthBounds(){
  const lo = new Date(START.getFullYear(), START.getMonth(), 1), hi = new Date(END.getFullYear(), END.getMonth(), 1);

}
function renderMonth(dir){

function renderMonthHead(dir){
  const vm = state.vm, y = vm.getFullYear(), m = vm.getMonth();
  const inM = DAYS.filter(x => x.d.getMonth() === m && x.d.getFullYear() === y);

  document.getElementById('mNext').disabled = vm >= hi;

  document.getElementById('mToday').innerHTML = (!isCur && PHASE === 'during') ? `<button class="pill-btn" onclick="monthToToday()"><span class="live-dot"></span>Back to ${MON[T0.getMonth()]}</button>` : '';
  // month position dots
  let dots = '', i = 0;
  for(let d = new Date(lo); d <= hi; d = new Date(d.getFullYear(), d.getMonth() + 1, 1), i++) dots += `<i class="${d.getTime() === vm.getTime() ? 'on' : ''}"></i>`;
  document.getElementById('calDots').innerHTML = dots;

function renderMonthGrid(dir, quiet){
  const vm = state.vm, y = vm.getFullYear(), m = vm.getMonth();
  const lead = (new Date(y, m, 1).getDay() + 6) % 7;
  const dim = new Date(y, m + 1, 0).getDate();
  const total = Math.ceil((lead + dim) / 7) * 7;
  let html = '';
  for(let i = 0; i < total; i++){
    const d = new Date(y, m, 1 - lead + i), k = dkey(d), x = BY_KEY[k];
    const other = d.getMonth() !== m;
    const cls = ['cell'];
    if(other) cls.push('other');
    else if(!x) cls.push('nodata');
    if(x){
      if(x.shade === 3 || x.tags.includes('holiday')) cls.push('hol');
      else if(x.shade === 2) cls.push('we2');
      else if(x.shade === 1 || x.wknd) cls.push('we');
      if(d < T0) cls.push('past');
      if(state.filter !== 'all' && !x.tags.includes(state.filter)) cls.push('dim');
    }
    if(k === TKEY && !other) cls.push('today');
    if(k === state.sel && !other) cls.push('sel');
    const dots = x && !other ? x.tags.map(t => `<i style="--cc:${CATS[t].color}"></i>`).join('') : '';
    html += `<button class="${cls.join(' ')}" style="--i:${quiet ? 0 : i}" data-k="${k}" ${x && !other ? '' : 'tabindex="-1"'} aria-label="${shortDate(d)}${x && x.text ? ': ' + esc(x.text) : ''}">
      <span class="cn">${d.getDate()}</span><span class="cd">${dots}</span></button>`;
  }
  const g = document.getElementById('calGrid');
  g.style.transition = 'none'; g.style.transform = ''; g.style.opacity = '';
  g.innerHTML = html;
  g.classList.remove('in-next', 'in-prev');
  if(quiet) g.querySelectorAll('.cell').forEach(c => c.style.animation = 'none');
  if(dir){ void g.offsetWidth; g.classList.add(dir > 0 ? 'in-next' : 'in-prev'); }
}
function selectDay(k){

function renderMonthList(){
  const vm = state.vm, y = vm.getFullYear(), m = vm.getMonth();
  let list = DAYS.filter(x => x.text && x.d.getMonth() === m && x.d.getFullYear() === y);

let monthBusy = false;
function shiftMonth(n){
  const {lo, hi} = monthBounds();
  const nv = new Date(state.vm.getFullYear(), state.vm.getMonth() + n, 1);
  if(nv < lo || nv > hi || monthBusy) return false;
  vib();
  state.vm = nv;
  const isCur = T0.getMonth() === nv.getMonth() && T0.getFullYear() === nv.getFullYear();
  const firstEv = DAYS.find(x => x.d.getMonth() === nv.getMonth() && x.d.getFullYear() === nv.getFullYear() && x.text)
               || DAYS.find(x => x.d.getMonth() === nv.getMonth() && x.d.getFullYear() === nv.getFullYear());
  state.sel = isCur && BY_KEY[TKEY] ? TKEY : (firstEv ? firstEv.key : null);
  renderMonth(n);
  return true;
}
function monthToToday(){
  const target = clampMonth(new Date(T0.getFullYear(), T0.getMonth(), 1));
  const dir = target > state.vm ? 1 : -1;
  state.vm = target; state.sel = BY_KEY[TKEY] ? TKEY : state.sel;
  renderMonth(dir); vib();
}
/* Swipe: the grid follows the finger, then flips to the next month. */
(function(){
  const vp = document.getElementById('calVp'), g = document.getElementById('calGrid');
  let sx = 0, sy = 0, dx = 0, lock = null, moved = false;
  vp.addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; dx = 0; lock = null; moved = false; g.style.transition = 'none'; }, {passive:true});
  vp.addEventListener('touchmove', e => {
    const x = e.touches[0].clientX - sx, y = e.touches[0].clientY - sy;
    if(lock === null && (Math.abs(x) > 8 || Math.abs(y) > 8)) lock = Math.abs(x) > Math.abs(y) ? 'x' : 'y';
    if(lock !== 'x') return;
    e.preventDefault(); moved = true; dx = x;
    const {lo, hi} = monthBounds();
    const edge = (dx > 0 && state.vm <= lo) || (dx < 0 && state.vm >= hi);
    const tx = edge ? dx * 0.25 : dx;
    g.style.transform = `translateX(${tx}px) rotate(${tx / 60}deg)`; g.style.opacity = String(1 - Math.min(.6, Math.abs(tx) / 500));
  }, {passive:false});
  vp.addEventListener('touchend', () => {
    if(lock !== 'x') return;
    const dir = dx < 0 ? 1 : -1;
    g.style.transition = 'transform .22s ease, opacity .22s ease';
    if(Math.abs(dx) > 55){
      const {lo, hi} = monthBounds();
      const nv = new Date(state.vm.getFullYear(), state.vm.getMonth() + dir, 1);
      if(nv >= lo && nv <= hi){
        monthBusy = true;
        g.style.transform = `translateX(${dir > 0 ? -110 : 110}%)`; g.style.opacity = '0';
        setTimeout(() => { monthBusy = false; shiftMonth(dir); }, 190);
        return;
      }
    }
    g.style.transform = ''; g.style.opacity = '';
  });
  vp.addEventListener('click', e => {
    if(moved){ moved = false; return; }
    const c = e.target.closest('.cell'); if(!c || c.classList.contains('other') || c.classList.contains('nodata')) return;
    if(state.sel === c.dataset.k){ openSheet(c.dataset.k); return; }
    selectDay(c.dataset.k);
  });
  document.addEventListener('keydown', e => {
    if(state.tab !== 'month' || document.getElementById('sheetOverlay').classList.contains('open')) return;
    if(e.key === 'ArrowLeft') shiftMonth(-1);
    if(e.key === 'ArrowRight') shiftMonth(1);
  });
})();

  let list = DAYS.filter(x => {
    if(state.filter !== 'all' && !x.tags.includes(state.filter)) return false;
    if(ql) return x.text.toLowerCase().includes(ql) || shortDate(x.d).toLowerCase().includes(ql) || MONTHS[x.d.getMonth()].toLowerCase().includes(ql);
    if(state.agMode === 'events') return !!x.text || x.key === TKEY;
    return true;
  });
  const evDays = list.filter(x => x.text).length;
  document.getElementById('agCount').textContent = (ql || state.filter !== 'all') ? `${list.length} match${list.length === 1 ? '' : 'es'}` : `${evDays} event days`;
  if(!list.length){
    el.innerHTML = `<div class="empty-note">No days match ${q ? `“${esc(q)}”` : 'this filter'}.<br>Try “exam”, “holiday”, “viva” or a month name.</div>`;
    hookAgendaObservers(); return;
  }
  let html = '', curM = -1, open = false, todayLinePlaced = false;
  const monthCount = {};
  list.forEach(x => { const mk = x.d.getFullYear()*12 + x.d.getMonth(); monthCount[mk] = (monthCount[mk] || 0) + (x.text ? 1 : 0); });
  list.forEach(x => {
    const mk = x.d.getFullYear()*12 + x.d.getMonth();
    if(mk !== curM){
      if(open) html += `</div>`;
      html += `<div class="ag-month"><div class="t">${MONTHS[x.d.getMonth()]} <span>${x.d.getFullYear()}</span></div><div class="n">${monthCount[mk]} event day${monthCount[mk] === 1 ? '' : 's'}</div></div><div class="ag-list">`;
      curM = mk; open = true;
    }
    if(!todayLinePlaced && !q && x.d >= T0 && x.key !== TKEY && PHASE === 'during'){
      html += `<div class="ag-today-line">TODAY · ${shortDate(T0).toUpperCase()}</div>`; todayLinePlaced = true;
    }
    if(x.key === TKEY) todayLinePlaced = true;
    const isToday = x.key === TKEY, past = x.d < T0;
    const cls = ['ag-row', 'rv', x.text ? '' : 'empty',
      x.shade === 3 || x.tags.includes('holiday') ? 'hol' : x.shade === 2 ? 'we2' : (x.shade === 1 || x.wknd) ? 'we' : '',
      isToday ? 'today' : '', past ? 'past' : ''].join(' ');
    const body = x.text ? `<span class="cdot" style="--cc:${CATS[x.cat].color}"></span>${fmtText(x.text, q)}` : (x.wknd ? 'Weekend' : 'No events');
    html += `<button class="${cls}" data-k="${x.key}" onclick="openSheet('${x.key}')">
      <div class="ag-d"><b>${x.d.getDate()}</b><span>${DOW[x.dow]}</span></div>
      <div class="ag-b"><div class="ag-t">${body}</div></div>
      ${isToday ? '<span class="tag now">TODAY</span>' : ''}</button>`;
  });
  if(open) html += `</div>`;
  el.innerHTML = html;
  hookAgendaObservers();
}
function hookAgendaObservers(){
  const rows = document.querySelectorAll('#agenda .ag-row.rv');
  if(!('IntersectionObserver' in window)){ rows.forEach(r => r.classList.add('in')); return; }
  if(revealObs) revealObs.disconnect();
  revealObs = new IntersectionObserver(es => es.forEach(e => { if(e.isIntersecting){ e.target.classList.add('in'); revealObs.unobserve(e.target); } }), {rootMargin:'0px 0px -20px 0px'});
  rows.forEach(r => revealObs.observe(r));
  if(todayObs) todayObs.disconnect();
  const fab = document.getElementById('jumpFab');
  const tr = document.querySelector('#agenda .ag-row.today');
  if(!tr){ fab.classList.remove('show'); return; }
  todayObs = new IntersectionObserver(es => es.forEach(e => {
    const show = !e.isIntersecting && state.tab === 'agenda';
    fab.classList.toggle('show', show);
    fab.classList.toggle('up', e.boundingClientRect.top < 0);
  }));
  todayObs.observe(tr);
}
function agendaToToday(smooth){
  const tr = document.querySelector('#agenda .ag-row.today');
  if(!tr) return;
  vib();
  tr.classList.add('in');
  const y = tr.getBoundingClientRect().top + window.scrollY - window.innerHeight / 2 + tr.offsetHeight / 2;
  window.scrollTo({top:Math.max(0, y), behavior:smooth ? 'smooth' : 'instant'});
}

/* ================= KEY DATES ================= */
function setKd(k){
  state.kd = k; vib();
  const seg = document.getElementById('kdSeg');
  const idx = ['holiday','exam','placement'].indexOf(k);
  seg.style.setProperty('--k', idx);
  seg.querySelectorAll('button').forEach((b, i) => b.classList.toggle('active', i === idx));
  renderKdList();
}
function renderKdCard(){
  const el = document.getElementById('kdCard');
  const h = RANGES.holiday, e = RANGES.exam, p = RANGES.placement;
  const left = list => list.filter(r => r.end.d >= T0).length;
  el.innerHTML = `<div class="card-h"><div class="t">Key dates</div><div class="m">${shortDate(START)} – ${shortDate(END)}</div></div>
    <div class="stats" style="margin-top:0">
      <div class="stat" style="--cc:var(--c-holiday)"><b data-n="${left(h)}">0</b><span>of ${h.length} holidays left</span></div>
      <div class="stat" style="--cc:var(--c-exam)"><b data-n="${left(e)}">0</b><span>of ${e.length} exam spells left</span></div>
      <div class="stat" style="--cc:var(--c-placement)"><b data-n="${left(p)}">0</b><span>of ${p.length} placement items</span></div>
    </div>`;
  el.querySelectorAll('[data-n]').forEach(b => countUp(b, +b.dataset.n));
}
function renderKdList(){
  const el = document.getElementById('kdList');
  const list = RANGES[state.kd];
  const nextIdx = list.findIndex(r => r.start.d > T0);
  let html = '<div class="tl">', curM = -1, todayPlaced = false;
  list.forEach((r, i) => {
    const mk = r.start.d.getFullYear()*12 + r.start.d.getMonth();
    if(!todayPlaced && r.end.d >= T0 && PHASE === 'during'){
      todayPlaced = true;
      if(i > 0) html += `<div class="tl-today" id="kdToday">TODAY · ${shortDate(T0).toUpperCase()}</div>`;
    }
    if(mk !== curM){ html += `<div class="tl-month">${MONTHS[r.start.d.getMonth()]} ${r.start.d.getFullYear()}</div>`; curM = mk; }
    const live = r.start.d <= T0 && r.end.d >= T0;
    const diff = dayDiff(T0, r.start.d);
    const cls = r.end.d < T0 ? 'done' : live ? 'live' : i === nextIdx ? 'next' : diff <= 14 ? 'soon' : '';
    const when = live ? (r.days > 1 ? `On now · till ${shortDate(r.end.d)}` : 'Today') : r.end.d < T0 ? relDays(dayDiff(T0, r.end.d)) : relDays(diff);
    const label = state.kd === 'holiday' ? cleanHoliday(keySegment(r.text, 'holiday')) : r.text;
    const weekendNote = state.kd === 'holiday' && r.days === 1 && r.start.wknd ? ' · falls on a weekend' : '';
    html += `<button class="tl-item ${cls}" style="--cc:${CATS[state.kd].color}; --i:${Math.min(i, 12)}" onclick="openSheet('${r.start.key}')">
      <span class="tl-node"></span>
      <div class="tl-date"><b>${r.start.d.getDate()}${r.days > 1 ? `<small>–${r.end.d.getDate()}</small>` : ''}</b><span>${DOW[r.start.dow]}${r.days > 1 ? '–' + DOW[r.end.dow] : ''}</span></div>
      <div class="tl-body"><div class="tl-label">${fmtText(label)}</div><div class="tl-when">${when}${r.days > 1 ? ` · ${r.days} days` : ''}${weekendNote}</div></div>
    </button>`;
  });
  html += '</div>';
  el.innerHTML = list.length ? html : `<div class="empty-note">Nothing listed.</div>`;
}
function renderNavBadge(){
  const b = document.getElementById('navBadge');
  const nx = RANGES.holiday.find(r => r.start.d >= T0);
  const d = nx ? dayDiff(T0, nx.start.d) : null;
  if(d !== null && d <= 7){ b.style.display = 'flex'; b.textContent = d === 0 ? '!' : d; b.title = `Holiday ${relDays(d)}`; }
  else b.style.display = 'none';
}

/* ================= BOTTOM SHEET ================= */
function openSheet(k){
  if(!BY_KEY[k]) return;
  vib();
  state.sheetKey = k;
  renderSheet(0);
  document.getElementById('sheet').scrollTop = 0;
  document.getElementById('sheetOverlay').classList.add('open');
}
function closeSheet(){
  const s = document.getElementById('sheet');
  s.style.transform = '';
  document.getElementById('sheetOverlay').classList.remove('open');
}
function renderSheet(dir){
  const x = BY_KEY[state.sheetKey];
  const sheet = document.getElementById('sheet');
  const sc = x.cat ? CATS[x.cat].color : x.wknd ? 'var(--c-weekend)' : 'var(--amber)';
  sheet.style.setProperty('--sc', sc);
  const diff = dayDiff(T0, x.d);
  const extra = [];
  if(x.wknd) extra.push(`<span class="ctag" style="--cc:var(--c-weekend)">Weekend</span>`);
  if(x.shade === 3 && !x.tags.includes('holiday')) extra.push(`<span class="ctag" style="--cc:var(--c-holiday)">Marked red</span>`);
  if(x.key === TKEY) extra.unshift(`<span class="ctag" style="--cc:var(--amber)">Today</span>`);
  const tags = ctags(x.tags) + extra.join('');
  document.getElementById('sheetContent').innerHTML = `<div class="sh-in ${dir > 0 ? 'from-r' : dir < 0 ? 'from-l' : ''}">
    <div class="sh-head">
      <div class="sh-date"><b>${x.d.getDate()}</b><span>${MON[x.d.getMonth()].toUpperCase()}</span></div>
      <div class="sh-title"><div class="a">${DOWL[x.dow]}</div><div class="b ${diff >= 0 && diff <= 7 ? 'hot' : ''}">${x.d.getDate()} ${MONTHS[x.d.getMonth()]} ${x.d.getFullYear()} · ${relDays(diff)}</div></div>
      <button class="sh-close" onclick="closeSheet()" aria-label="Close"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    ${tags ? `<div class="sh-tags">${tags}</div>` : ''}
    <div class="sh-text ${x.text ? '' : 'dim'}">${x.text ? fmtText(x.text) : (x.wknd ? 'Weekend — nothing on the calendar.' : 'No events listed for this day.')}</div>
    <div class="sh-actions">
      <button class="sh-btn" onclick="sheetStep(-1)" ${x.i === 0 ? 'disabled' : ''} aria-label="Previous day"><svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button class="sh-btn" onclick="sheetToMonth()"><svg class="i" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="16" rx="3"/><path d="M3.5 9.5h17"/></svg>In month</button>
      <button class="sh-btn pri" onclick="shareDay('${x.key}')"><svg class="i" viewBox="0 0 24 24"><path d="M12 15V3M7.5 7.5L12 3l4.5 4.5"/><path d="M5 12v6.5A2.5 2.5 0 0 0 7.5 21h9a2.5 2.5 0 0 0 2.5-2.5V12"/></svg>Share</button>
      <button class="sh-btn" onclick="sheetStep(1)" ${x.i === DAYS.length - 1 ? 'disabled' : ''} aria-label="Next day"><svg class="i" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
  </div>`;
}
function sheetStep(n){
  const x = BY_KEY[state.sheetKey];
  const y = DAYS[x.i + n]; if(!y) return;
  vib(4); state.sheetKey = y.key; renderSheet(n);
}
function sheetToMonth(){
  const x = BY_KEY[state.sheetKey];
  closeSheet();
  const target = new Date(x.d.getFullYear(), x.d.getMonth(), 1);
  const dir = state.vm ? (target > state.vm ? 1 : target < state.vm ? -1 : 0) : 0;
  state.vm = target; state.sel = x.key;
  switchTab('month');
  renderMonth(dir || null);
}
/* Drag down to dismiss, swipe sideways to step days. */
(function(){
  const s = document.getElementById('sheet');
  let sy = 0, sx = 0, dy = 0, dx = 0, lock = null, active = false;
  s.addEventListener('touchstart', e => {
    active = s.scrollTop <= 0; sy = e.touches[0].clientY; sx = e.touches[0].clientX; dy = 0; dx = 0; lock = null;
  }, {passive:true});
  s.addEventListener('touchmove', e => {
    const y = e.touches[0].clientY - sy, x = e.touches[0].clientX - sx;
    if(lock === null && (Math.abs(x) > 10 || Math.abs(y) > 10)) lock = Math.abs(x) > Math.abs(y) ? 'x' : 'y';
    if(lock === 'x'){ dx = x; return; }
    if(lock === 'y' && active && y > 0){ e.preventDefault(); dy = y; s.classList.add('dragging'); s.style.transform = `translateY(${y}px)`; }
  }, {passive:false});
  s.addEventListener('touchend', () => {
    if(lock === 'x' && Math.abs(dx) > 60){ sheetStep(dx < 0 ? 1 : -1); return; }
    if(lock !== 'y') return;
    s.classList.remove('dragging');
    if(dy > 110) closeSheet(); else s.style.transform = '';
  });
})();
document.addEventListener('keydown', e => {
  if(!document.getElementById('sheetOverlay').classList.contains('open')) return;
  if(e.key === 'Escape') closeSheet();
  if(e.key === 'ArrowLeft') sheetStep(-1);
  if(e.key === 'ArrowRight') sheetStep(1);
});

/* ================= SHARE / TOAST ================= */
function shareDay(k){
  const x = BY_KEY[k];
  const text = `${DOWL[x.dow]}, ${x.d.getDate()} ${MONTHS[x.d.getMonth()]} ${x.d.getFullYear()}\n${x.text || 'No events listed'}\n— PSGIM Academic Calendar 2026–27`;
  vib(8);
  if(navigator.share){ navigator.share({title:'PSGIM Academic Calendar', text, url:location.href.split('?')[0]}).catch(() => {}); return; }
  const done = () => toast('Copied to clipboard');
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, () => toast('Could not copy'));
  else toast('Sharing not supported here');
}
let toastT = null;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 1800);
}

/* ================= TABS / THEME ================= */
function switchTab(t, keepScroll){
  if(!TABS.includes(t)) return;
  const from = TABS.indexOf(state.tab), to = TABS.indexOf(t);
  const same = t === state.tab;
  state.tab = t;
  if(!same) vib();
  TABS.forEach(x => {
    document.getElementById('nav-' + x).classList.toggle('active', x === t);
    const v = document.getElementById('view-' + x);
    v.classList.remove('on', 'from-l', 'from-r');
    if(x === t){ v.classList.add('on'); if(!same){ void v.offsetWidth; v.classList.add(to > from ? 'from-r' : 'from-l'); } }
  });
  document.getElementById('navInd').style.setProperty('--k', to);
  document.getElementById('jumpFab').classList.remove('show');
  try { history.replaceState(null, '', location.pathname + location.search + '#' + t); } catch(e){}
  if(t === 'today' && !same){ renderYear(); renderCountdowns(); }
  if(t === 'dates'){ renderKdCard(); renderKdList(); }
  if(t === 'agenda'){
    hookAgendaObservers();
    if(!state.agendaScrolled){ state.agendaScrolled = true; requestAnimationFrame(() => agendaToToday(false)); return; }
  }
  if(!keepScroll) window.scrollTo({top:0, behavior:'instant'});
  if(t === 'dates' && !keepScroll){
    requestAnimationFrame(() => { const m = document.getElementById('kdToday'); if(m) window.scrollTo({top:Math.max(0, m.getBoundingClientRect().top + scrollY - innerHeight/3), behavior:'smooth'}); });
  }
}
function syncThemeColor(){
  const panel = getComputedStyle(document.documentElement).getPropertyValue('--panel').trim();
  document.getElementById('themeColorMeta').setAttribute('content', panel || '#12161C');
}
function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme');
  const nx = cur === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', nx);
  try { localStorage.setItem('psgim-cal-theme', nx); } catch(e){}
  const b = document.getElementById('themeBtn'); b.innerHTML = b.innerHTML; // replay icon animation
  syncThemeColor(); vib();
}
function measureHeader(){
  const h = document.getElementById('pageHeader').offsetHeight;
  document.documentElement.style.setProperty('--hdr', (h - 1) + 'px');
}

/* ================= INIT / REFRESH ================= */
function renderAll(){
  renderHeader(); renderClock();
  renderBoard(); renderTicker(); renderCountdowns(); renderWeek(); renderYear(); renderUpcoming();
  renderLegends(); renderMonth(null); renderAgenda(); renderKdCard(); renderKdList(); renderNavBadge();
}
function secondTick(){
  if(document.hidden) return;
  renderClock(); tickBoard(); tickCountdowns();
}
/* Phones suspend timers in the background, so the date is re-checked whenever
   the app returns to the foreground — not only on the timer. */
function refreshIfNewDay(){
  const oldKey = TKEY;
  computeToday();
  if(TKEY === oldKey) return;
  const wasOnTodayMonth = state.vm && state.vm.getMonth() === parseD(oldKey).getMonth();
  if(wasOnTodayMonth) state.vm = clampMonth(new Date(T0.getFullYear(), T0.getMonth(), 1));
  if(state.sel === oldKey && BY_KEY[TKEY]) state.sel = TKEY;
  renderAll();
}
function init(){
  syncThemeColor();
  state.vm = clampMonth(new Date(T0.getFullYear(), T0.getMonth(), 1));
  state.sel = BY_KEY[TKEY] ? TKEY : (DAYS.find(x => x.d.getMonth() === state.vm.getMonth() && x.d.getFullYear() === state.vm.getFullYear() && x.text) || DAYS[0]).key;
  measureHeader();
  renderAll();
  const h = (location.hash || '').slice(1);
  if(TABS.includes(h) && h !== 'today') switchTab(h);
  setInterval(secondTick, 1000);
  setInterval(refreshIfNewDay, 30000);
  document.addEventListener('visibilitychange', () => { if(!document.hidden){ refreshIfNewDay(); secondTick(); } });
  window.addEventListener('focus', refreshIfNewDay);
  window.addEventListener('pageshow', refreshIfNewDay);
  window.addEventListener('resize', measureHeader);
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(() => { measureHeader(); renderTicker(); });
}
init();

if('serviceWorker' in navigator){
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
